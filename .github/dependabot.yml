version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned on purpose: DuckDB 2.0 changed how one connection handles concurrent use (see requirements.txt).
      - dependency-name: duckdb
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The tests and the measurements are on Python 3.12. Move the base image together with requires-python and CI.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
