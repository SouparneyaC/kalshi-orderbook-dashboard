name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove your Kalshi key ID and any private key text from logs before pasting them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and the settings in `.env` other than the key (for example `BOOK_COUNT`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system, or "Docker" with the host system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from the server output.
      render: text
