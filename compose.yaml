# Try the service in a container:
#   cp .env.example .env              (set KALSHI_KEY_ID, and KALSHI_PRIVATE_KEY_FILE to the path of your key)
#   mkdir -p data
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up --build
# Then open http://localhost:8000. The port is published on 127.0.0.1 only: the app has no login of its own.
services:
  tradedash:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # Run as your own user so the container can read a key file that only you can read.
    user: "${HOST_UID:?set HOST_UID and HOST_GID, see the top of this file}:${HOST_GID:?set HOST_UID and HOST_GID, see the top of this file}"
    environment:
      KALSHI_KEY_ID: ${KALSHI_KEY_ID:?set KALSHI_KEY_ID in .env}
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi_key.pem
      BOOK_COUNT: ${BOOK_COUNT:-25}
      PERSIST_TRADES: ${PERSIST_TRADES:-0}
    volumes:
      - ${KALSHI_PRIVATE_KEY_FILE:?set KALSHI_PRIVATE_KEY_FILE in .env}:/run/secrets/kalshi_key.pem:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
